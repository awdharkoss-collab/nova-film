<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA TV • Türkiye Canlı Yayın</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NOVA TV">
    <link rel="apple-touch-icon" href="logo.png">
    <script src="https://cloudflare.com"></script>
    <style>
        :root { --bg: #0d0d10; --surface: #16161d; --red: #e50914; --text: #ffffff; --muted: #b3b3b3; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 50px; }
        .navbar { position: sticky; top: 0; z-index: 200; background: rgba(13,13,16,0.96); backdrop-filter: blur(10px); padding: 14px 20px; display: flex; align-items: center; gap: 14px; overflow-x: auto; border-bottom: 1px solid rgba(255,255,255,0.08); scrollbar-width: none; }
        .navbar::-webkit-scrollbar { display: none; }
        .logo { font-size: 22px; font-weight: 900; color: var(--red); letter-spacing: 1.5px; white-space: nowrap; }
        .nav-links { display: flex; gap: 8px; align-items: center; }
        .nav-item { color: #ddd; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; padding: 6px 12px; border-radius: 20px; background: #1c1c26; }
        .nav-item.active { background: var(--red); color: #fff; }
        .nav-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
        .search-input { background: #1f1f2b; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 7px 14px; border-radius: 20px; font-size: 13px; width: 150px; outline: none; }
        .local-btn { background: rgba(255,255,255,0.15); color: #fff; border: none; padding: 7px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .section-header { padding: 18px 20px 12px; font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 0 20px; }
        .card { background: var(--surface); border-radius: 10px; overflow: hidden; cursor: pointer; position: relative; border: 1px solid rgba(255,255,255,0.06); transition: transform 0.2s; }
        .card:hover { transform: scale(1.03); border-color: var(--red); }
        .card img { width: 100%; height: 115px; object-fit: contain; background: #111117; display: block; padding: 12px; }
        .live-dot { position: absolute; top: 8px; left: 8px; background: var(--red); color: #fff; font-weight: 900; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        .fav-btn { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); border: none; color: #fff; font-size: 14px; padding: 4px 7px; border-radius: 50%; cursor: pointer; }
        .card-body { padding: 10px; }
        .card-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 999; flex-direction: column; justify-content: center; }
        .modal-top { position: absolute; top: 0; left: 0; right: 0; padding: 16px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .close-btn { background: var(--red); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        video { width: 100%; max-height: 85vh; background: #000; }
        .loader { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo">NOVA TV</div>
    <div class="nav-links">
        <div class="nav-item active" onclick="filterCat('Tümü', this)">Tümü</div>
        <div class="nav-item" onclick="filterCat('Ulusal', this)">Ulusal</div>
        <div class="nav-item" onclick="filterCat('Çocuk', this)">Çocuk & Çizgi Film</div>
        <div class="nav-item" onclick="filterCat('Haber', this)">Haber</div>
        <div class="nav-item" onclick="filterCat('Belgesel', this)">Belgesel</div>
        <div class="nav-item" onclick="filterCat('Spor', this)">Spor</div>
        <div class="nav-item" onclick="filterCat('Müzik', this)">Müzik</div>
        <div class="nav-item" onclick="filterCat('Favoriler', this)">❤️ Favoriler</div>
    </div>
    <div class="nav-right">
        <input type="file" id="localFileInput" accept="video/*" style="display:none" onchange="openLocalVideo(event)">
        <button class="local-btn" onclick="document.getElementById('localFileInput').click()">📂 Cihazdan Aç</button>
        <input type="text" id="searchInput" class="search-input" placeholder="Kanal ara..." oninput="renderChannels()">
    </div>
</nav>

<div class="section-header">
    <span id="sectionTitle">Türkiye Canlı TV Kanalları</span>
    <span id="countLabel" style="font-size:13px; color:#aaa;"></span>
</div>
<div id="statusMsg" class="loader">Güncel Türkiye canlı yayın listesi yükleniyor...</div>
<div class="grid" id="contentGrid"></div>

<div class="modal" id="playerModal">
    <div class="modal-top">
        <span id="playerTitle" style="font-weight:700; font-size:16px;"></span>
        <button class="close-btn" onclick="closePlayer()">✕ Kapat</button>
    </div>
    <video id="videoPlayer" controls playsinline preload="auto"></video>
</div>
<script>
    const m3uSource = atob("aHR0cHM6Ly9pcHR2LW9yZy5naXRodWIuaW8vaXB0di9jb3VudHJpZXMvdHIubTN1");
    let channels = [];
    let currentCat = "Tümü";
    let favs = JSON.parse(localStorage.getItem("novatv_favs") || "[]");
    let hlsInstance = null;

    function makeLogo(name) {
        const c = document.createElement("canvas");
        c.width = 360; c.height = 200;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#14141d"; ctx.fillRect(0, 0, 360, 200);
        ctx.fillStyle = "#e50914"; ctx.fillRect(0, 0, 8, 200);
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(name.slice(0, 18), 184, 108);
        return c.toDataURL("image/png");
    }

    function detectCategory(name, group) {
        const n = (name + " " + group).toLowerCase();
        if (n.includes("çocuk") || n.includes("cocuk") || n.includes("cartoon") || n.includes("minika") || n.includes("disney") || n.includes("kids") || n.includes("zarok")) return "Çocuk";
        if (n.includes("haber") || n.includes("ntv") || n.includes("cnn") || n.includes("a haber") || n.includes("halk") || n.includes("tele1") || n.includes("sözcü") || n.includes("habertürk")) return "Haber";
        if (n.includes("belgesel") || n.includes("yaban") || n.includes("nat geo") || n.includes("discovery") || n.includes("tlc") || n.includes("dmax")) return "Belgesel";
        if (n.includes("spor") || n.includes("sport") || n.includes("tjk") || n.includes("fb") || n.includes("gs") || n.includes("bjk")) return "Spor";
        if (n.includes("müzik") || n.includes("muzik") || n.includes("kral") || n.includes("powertürk") || n.includes("dream") || n.includes("number1")) return "Müzik";
        return "Ulusal";
    }

    async function initChannels() {
        try {
            const res = await fetch(m3uSource);
            const text = await res.text();
            const lines = text.split("\n");
            const list = [];
            for (let i = 0; i < lines.length; i++) {
                if (lines.at(i).startsWith("#EXTINF")) {
                    const info = lines.at(i);
                    const url = (lines.at(i + 1) || "").trim();
                    const name = info.split(",").at(-1).replace(/\(.*?\)/g, "").trim();
                    const logoMatch = info.match(/tvg-logo="([^"]+)"/);
                    const groupMatch = info.match(/group-title="([^"]+)"/);
                    if (url.startsWith("https://")) {
                        list.push({
                            id: name + "_" + i,
                            title: name,
                            cat: detectCategory(name, groupMatch ? groupMatch.at(1) : ""),
                            url: url,
                            logo: logoMatch ? logoMatch.at(1) : makeLogo(name),
                            fallback: makeLogo(name)
                        });
                    }
                }
            }
            channels = list;
            document.getElementById("statusMsg").style.display = "none";
            renderChannels();
        } catch (e) {
            document.getElementById("statusMsg").innerText = "Yayın listesi alınamadı, lütfen bağlantınızı kontrol edin.";
        }
    }

    function filterCat(cat, el) {
        currentCat = cat;
        document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
        el.classList.add("active");
        document.getElementById("sectionTitle").innerText = cat === "Tümü" ? "Türkiye Canlı TV Kanalları" : cat + " Kanalları";
        renderChannels();
    }

    function toggleFav(id, e) {
        e.stopPropagation();
        if (favs.includes(id)) favs = favs.filter(x => x !== id);
        else favs.push(id);
        localStorage.setItem("novatv_favs", JSON.stringify(favs));
        renderChannels();
    }

    function renderChannels() {
        const q = document.getElementById("searchInput").value.toLowerCase();
        const grid = document.getElementById("contentGrid");
        grid.innerHTML = "";

        const filtered = channels.filter(c => {
            const matchQ = c.title.toLowerCase().includes(q);
            const matchCat = currentCat === "Tümü" || (currentCat === "Favoriler" && favs.includes(c.id)) || c.cat === currentCat;
            return matchQ && matchCat;
        });

        document.getElementById("countLabel").innerText = filtered.length + " kanal";
        filtered.forEach(c => {
            const isFav = favs.includes(c.id);
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<div class="live-dot">● CANLI</div><button class="fav-btn" onclick="toggleFav('${c.id}', event)">${isFav ? '❤️' : '🤍'}</button><img src="${c.logo}" onerror="this.src='${c.fallback}'" loading="lazy"><div class="card-body"><div class="card-title">${c.title}</div><div class="card-sub">${c.cat} • HD Yayın</div></div>`;
            card.onclick = () => playStream(c.title, c.url);
            grid.appendChild(card);
        });
    }

    function playStream(title, url) {
        const modal = document.getElementById("playerModal");
        const video = document.getElementById("videoPlayer");
        document.getElementById("playerTitle").innerText = title;
        modal.style.display = "flex";

        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

        if (typeof Hls !== "undefined" && Hls.isSupported() && url.includes(".m3u8")) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            hlsInstance.on(Hls.Events.ERROR, (ev, data) => {
                if (data.fatal) {
                    alert("Bu kanal şu anda yayın vermiyor veya tarayıcı engeline takıldı.");
                    closePlayer();
                }
            });
        } else {
            video.src = url;
            video.play();
        }
    }

    function openLocalVideo(event) {
        const file = event.target.files.item(0);
        if (!file) return;
        playStream(file.name, URL.createObjectURL(file));
    }

    function closePlayer() {
        const modal = document.getElementById("playerModal");
        const video = document.getElementById("videoPlayer");
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        video.pause();
        video.src = "";
        modal.style.display = "none";
    }

    initChannels();
</script>
</body>
</html>
